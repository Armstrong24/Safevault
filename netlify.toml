# Netlify deploy settings for the SafeVault dashboard (login + results + chatbot functions).
[build]
  publish = "website"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"   # bundles netlify/lib/auth.mjs into each function

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
